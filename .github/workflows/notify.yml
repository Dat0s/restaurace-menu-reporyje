name: Menu freshness alert

# Runs Mon/Tue/Fri after the last local scrape attempt (11:00 Prague).
# 10:15 UTC = 11:15 Prague in winter, 12:15 in summer.
# When the check fails, GitHub e-mails the repo owner about the failed run —
# that IS the notification (no SMTP setup needed).
on:
  schedule:
    - cron: "15 10 * * 1,2,5"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Fail on purpose to test e-mail delivery"
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Test e-mail delivery (forced failure)
        if: ${{ inputs.test_email }}
        run: |
          echo "Testovací selhání pro ověření doručení e-mailu — vše je v pořádku."
          exit 1

      - name: Check menu freshness on live site
        run: node scripts/check-freshness.js
