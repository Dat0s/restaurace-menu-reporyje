name: Scrape Menu Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scrapers/py/requirements.txt

      - run: pip install -r scrapers/py/requirements.txt

      - run: npm run scrape
        env:
          FB_COOKIES: ${{ secrets.FB_COOKIES }}
          IG_COOKIES: ${{ secrets.IG_COOKIES }}

      - name: Pre-render menu HTML
        run: node scripts/prerender.js

      - name: Update sitemap lastmod
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          sed -i "s|<lastmod>.*</lastmod>|<lastmod>${TODAY}</lastmod>|" docs/sitemap.xml

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/menu-data.json docs/sitemap.xml docs/index.html
          git diff --staged --quiet || git commit -m "data: update menu"
          git pull --rebase || true
          git push || true
